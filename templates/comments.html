<!DOCTYPE html>
<html>
<head><title>Comments</title></head>
<body>
  <h2>Comments</h2>
  <form method="POST">
    <textarea name="content" rows="3" cols="40" placeholder="Write a comment..." required></textarea><br><br>
    <button type="submit">Post</button>
  </form>
  <hr>
  {% for c in comments %}
    {# The server sanitizes comment content before it reaches this HTML . #}
    <p><b>{{ c[0] }}:</b> {{ c[1] | safe }}</p>
  {% endfor %}
  <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
